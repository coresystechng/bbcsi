<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Thank You | BBCSI</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Funnel+Display:wght@300..800&display=swap" rel="stylesheet">
  <link rel="icon" href="assets/img/bbcsi_logo.jpg" type="image/x-icon">
  <link rel="apple-touch-icon" href="assets/img/bbcsi_logo.jpg">

    <!-- Optional: Prevent iOS from linking numbers -->
    <meta name="format-detection" content="telephone=no">
  <style>
    body {
      background-color: #f8f9fa;
      font-family: 'Funnel Display', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    .thank-you-box {
      text-align: center;
      background: #fff;
      border-radius: 12px;
      padding: 3rem;
      box-shadow: 0 4px 20px rgba(0,0,0,0.1);
    }
    .thank-you-box h1 {
      color: #DA2968;
      font-weight: 700;
    }
    .thank-you-box p {
      color: #555;
      font-size: 1.1rem;
      margin-bottom: 25px;
    }
    .btn-home {
      background-color: #DA2968;
      color: #fff;
      border: none;
      border-radius: 30px;
      padding: 0.75rem 1.5rem;
      margin-top: 1rem;
      font-weight: 600;
      text-decoration: none;
      transition: 0.3s;
    }
    .btn-home:hover {
      background-color: #b71e56;
      text-decoration: none;
    }
  </style>
</head>
<body>

  <div class="thank-you-box">
    <h1>Thank You!</h1>
    <p>Your message has been sent successfully.<br>We’ll get back to you shortly.</p>
    <a href="index.html" class="btn-home">Return to Home</a>
  </div>

</body>
</html>
