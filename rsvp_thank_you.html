<head>
  <meta charset="UTF-8">
  <title>RSVP Received | BBCSI Gala Night</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, follow">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Marko+One&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Funnel+Display:wght@300..800&display=swap" rel="stylesheet">
  <link rel="icon" href="assets/img/bbcsi_logo.jpg" type="image/x-icon">
  <link rel="apple-touch-icon" href="assets/img/bbcsi_logo.jpg">
  <meta name="format-detection" content="telephone=no">
  <style>
    :root {
      --gala-gold: #d4af37;
      --bbc-dark-text: #555457;
    }

    body {
      align-items: center;
      background:
        linear-gradient(rgba(21, 16, 18, 0.82), rgba(83, 11, 41, 0.78)),
        url('assets/img/gala-night.jpg') center center/cover no-repeat;
      color: var(--bbc-dark-text);
      display: flex;
      font-family: 'Funnel Display', sans-serif;
      justify-content: center;
      min-height: 100vh;
      padding: 1.5rem;
    }

    .heading { font-family: 'Marko One', sans-serif; }

    .thank-you-box {
      background: #fff;
      border-radius: 8px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.28);
      max-width: 680px;
      padding: 3rem;
      text-align: center;
      width: 100%;
    }

    .thank-you-box h1 {
      color: var(--gala-gold);
      font-weight: 700;
    }

    .btn-home {
      background-color: var(--gala-gold);
      border-radius: 30px;
      color: #17110a;
      display: inline-block;
      font-weight: 700;
      margin-top: 1rem;
      padding: 0.75rem 1.5rem;
      text-decoration: none;
      transition: 0.25s;
    }

    .btn-home:hover,
    .btn-home:focus {
      background-color: #f2c75c;
      color: #17110a;
      text-decoration: none;
      transform: translateY(-2px);
    }
  </style>
</head>

<body>
  <main class="thank-you-box">
    <img src="assets/img/bbcsi_logo.jpg" alt="BBCSI" width="86" class="mb-3">
    <h1 class="heading">RSVP Received</h1>
    <p class="lead mb-2">Thank you for responding to BBCSI Decade of Impact Gala Night.</p>
    <p class="mb-4">The BBCSI team will review your RSVP and follow up with any event details, table information, or sponsorship next steps.</p>
