<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gallery | Benue Breast Cancer Support Initiative</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- AOS CSS -->
  <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Funnel+Display:wght@400;600&display=swap" rel="stylesheet">

  <style>
    :root {
      --bbc-pink: #da2968;
      --bbc-dark: #333;
    }
    body {
      font-family: 'Funnel Display', sans-serif;
      background-color: #f8f9fa;
      color: var(--bbc-dark);
    }
    .heading {
      font-weight: 700;
      font-size: 2.5rem;
      color: var(--bbc-pink);
    }

    /* Gallery Grid */
    .gallery-img {
      position: relative;
      overflow: hidden;
      border-radius: 12px;
      cursor: pointer;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }
    .gallery-img img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.4s ease;
    }
    .gallery-img:hover img {
      transform: scale(1.05);
    }
    .gallery-img:hover {
      box-shadow: 0 10px 25px rgba(218, 41, 104, 0.25);
    }

    /* Fullscreen Material Box */
    #materialBox {
      position: fixed;
      display: none;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      background: rgba(0,0,0,0.9);
      justify-content: center;
      align-items: center;
      flex-direction: column;
      z-index: 2000;
    }
    #materialBox img {
      max-width: 90%;
      max-height: 80vh;
      border-radius: 8px;
      box-shadow: 0 4px 30px rgba(0,0,0,0.4);
    }
    #materialBox p {
      color: #fff;
      margin-top: 1rem;
      font-size: 1rem;
      text-align: center;
    }

    /* Navigation arrows */
    .nav-arrow {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      font-size: 2rem;
      color: white;
      cursor: pointer;
      user-select: none;
      transition: opacity 0.3s ease;
    }
    .nav-arrow:hover {
      opacity: 0.7;
    }
    .nav-left { left: 40px; }
    .nav-right { right: 40px; }
  </style>
</head>
<body>

  <!-- Header -->
  <header class="text-center py-5 bg-white shadow-sm">
    <div class="container" data-aos="fade-down">
      <h1 class="heading mb-2">Our Gallery</h1>
      <p class="lead text-muted mb-0">Moments of hope, courage, and community — captured through our journey.</p>
    </div>
  </header>

  <!-- Gallery Section -->
  <main class="py-5 bg-light">
    <div class="container py-5">
      <div class="row g-4" id="gallery">

        <!-- Gallery Items -->
        <div class="col-sm-6 col-md-4 col-lg-3" data-aos="zoom-in">
          <div class="gallery-img" onclick="openMaterialBox(0)">
            <img src="assets/img/african-women.jpg" alt="Awareness walk in Gboko community">
          </div>
        </div>

        <div class="col-sm-6 col-md-4 col-lg-3" data-aos="zoom-in" data-aos-delay="50">
          <div class="gallery-img" onclick="openMaterialBox(1)">
            <img src="assets/img/african-women-1.jpg" alt="BBCSI members during a sensitization program">
          </div>
        </div>

        <div class="col-sm-6 col-md-4 col-lg-3" data-aos="zoom-in" data-aos-delay="100">
          <div class="gallery-img" onclick="openMaterialBox(2)">
            <img src="assets/img/african-women-3.jpg" alt="Free screening event for women">
          </div>
        </div>

        <div class="col-sm-6 col-md-4 col-lg-3" data-aos="zoom-in" data-aos-delay="150">
          <div class="gallery-img" onclick="openMaterialBox(3)">
            <img src="assets/img/self-test.jpg" alt="Survivor support group meeting">
          </div>
        </div>

        <div class="col-sm-6 col-md-4 col-lg-3" data-aos="zoom-in" data-aos-delay="200">
          <div class="gallery-img" onclick="openMaterialBox(4)">
            <img src="assets/img/2148959216.jpg" alt="BBCSI health partnership launch">
          </div>
        </div>

        <div class="col-sm-6 col-md-4 col-lg-3" data-aos="zoom-in" data-aos-delay="250">
          <div class="gallery-img" onclick="openMaterialBox(5)">
            <img src="assets/img/black-executive-analyst-finalizes-financial-report-reviews-data.jpg" alt="BBCSI outreach team volunteers">
          </div>
        </div>

      </div>
    </div>
  </main>

  <!-- Fullscreen Material Box -->
  <div id="materialBox" onclick="closeMaterialBox()">
    <span class="nav-arrow nav-left" onclick="prevImage(event)"><i class="bi bi-chevron-left"></i></span>
    <span class="nav-arrow nav-right" onclick="nextImage(event)"><i class="bi bi-chevron-right"></i></span>
    <img src="" alt="Fullscreen Image">
    <p id="materialCaption"></p>
  </div>

  <!-- Footer -->
  <footer class="py-4 bg-white text-center border-top">
    <p class="mb-0 text-muted small">&copy; 2025 Benue Breast Cancer Support Initiative. All rights reserved.</p>
  </footer>

  <!-- Bootstrap + AOS + Custom JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
  <script>
    // Initialize AOS
    AOS.init({ duration: 800, once: true });

    // Gallery logic
    const materialBox = document.getElementById('materialBox');
    const materialImg = materialBox.querySelector('img');
    const materialCaption = document.getElementById('materialCaption');
    const galleryImages = [...document.querySelectorAll('#gallery img')];
    let currentIndex = 0;

    function openMaterialBox(index) {
      currentIndex = index;
      const img = galleryImages[index];
      materialImg.src = img.src;
      materialCaption.textContent = img.alt;
      materialBox.style.display = 'flex';
      document.body.style.overflow = 'hidden'; // Prevent scroll while open
    }

    function closeMaterialBox() {
      materialBox.style.display = 'none';
      document.body.style.overflow = '';
    }

    function nextImage(e) {
      e.stopPropagation();
      currentIndex = (currentIndex + 1) % galleryImages.length;
      openMaterialBox(currentIndex);
    }

    function prevImage(e) {
      e.stopPropagation();
      currentIndex = (currentIndex - 1 + galleryImages.length) % galleryImages.length;
      openMaterialBox(currentIndex);
    }

    // Keyboard navigation
    document.addEventListener('keydown', (e) => {
      if (materialBox.style.display === 'flex') {
        if (e.key === 'ArrowRight') nextImage(e);
        if (e.key === 'ArrowLeft') prevImage(e);
        if (e.key === 'Escape') closeMaterialBox();
      }
    });
  </script>
</body>
</html>
